[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kuava-sim"
version = "0.1.0"
description = "Deterministic fixed-step 1-D altitude simulation of a drone"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "control>=0.10,<0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
